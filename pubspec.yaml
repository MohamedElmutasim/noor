name: noor
description: "نور (Noor) - تطبيق إسلامي شامل وحديث مبني باستخدام Flutter، يوفر مواقيت الصلاة بدقة، القرآن الكريم، متابعة الختمة، الأذكار وحصن المسلم، بوصلة القبلة، والتلاوات الصوتية."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  geolocator: ^14.0.1
  flutter_timezone: ^5.1.1
  adhan: ^2.0.0+1
  geocoding: ^5.0.1
  quran: ^1.4.1
  google_fonts: ^9.0.0
  audioplayers: ^6.8.1
  home_widget: ^0.9.4
  hijri: ^3.0.1
  dio: ^5.11.1
  path_provider: ^2.1.6
  flutter_compass: ^0.8.1
  vibration: ^3.2.1
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/app_icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/app_icon.png
